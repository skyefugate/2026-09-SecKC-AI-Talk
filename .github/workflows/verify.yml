name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitized:
    name: no production data in published artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Generic checks only: routable IPv4, non-documentation IPv6, and the
      # reserved-range assertions. The account number and organisation token are
      # deliberately not available to CI, because putting them in a repository
      # secret would mean committing to storing them at all.
      - name: audit docs/demos
        run: python3 scripts/sanitize.py --check docs/demos/*.html

  template:
    name: cloudformation template parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install cfn-lint
        run: pip install --disable-pip-version-check cfn-lint==1.22.3

      - name: lint
        run: cfn-lint iac/vpc-baseline/template.yaml

  html:
    name: html and links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: check local references resolve
        run: python3 scripts/check-links.py
