name: architecture docs

# Keeps iac/*/README.md in step with the CloudFormation templates.
#
#   push (any branch)      -> regenerate and commit the result back
#   pull_request from fork -> verify only

on:
  push:
    paths:
      - "iac/**"
      - "!iac/README.md"
      - "!iac/**/README.md"
      - "scripts/gen-arch-docs.py"
      - ".github/workflows/architecture-docs.yml"
  pull_request:
    paths:
      - "iac/**"
      - "!iac/README.md"
      - "!iac/**/README.md"
      - "scripts/gen-arch-docs.py"
      - ".github/workflows/architecture-docs.yml"
  workflow_dispatch:

concurrency:
  group: architecture-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: regenerate and commit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install --disable-pip-version-check pyyaml==6.0.2 cfn-lint==1.22.3

      - name: lint templates before documenting them
        run: |
          shopt -s globstar nullglob
          templates=(iac/**/template.yaml iac/**/template.yml)
          printf 'linting %s\n' "${templates[@]}"
          cfn-lint "${templates[@]}"

      - name: regenerate
        run: python3 scripts/gen-arch-docs.py --root iac

      - name: verify the generator is deterministic
        run: python3 scripts/gen-arch-docs.py --root iac --check

      - name: detect changes
        id: diff
        run: |
          # Nothing else in this job writes to the tree, so anything dirty under
          # iac/ is a regenerated README.
          if git diff --quiet -- iac; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Architecture docs already match the templates." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Architecture documentation updated"
              echo '```diff'
              git diff -- iac
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: commit
        if: steps.diff.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ':(glob)iac/**/README.md'
          git commit \
            -m "docs(iac): regenerate architecture diagrams" \
            -m "Generated by scripts/gen-arch-docs.py from the IaC templates at ${GITHUB_SHA}."
          git push origin "HEAD:${BRANCH}"

  verify:
    name: verify docs are current (fork PRs)
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install --disable-pip-version-check pyyaml==6.0.2

      - name: check
        run: |
          if ! python3 scripts/gen-arch-docs.py --root iac --check; then
            echo "::error::Architecture docs are out of date. Run 'python3 scripts/gen-arch-docs.py --root iac' and commit the result."
            exit 1
          fi
